spring.application.name=urban-risk-backend
server.port=8080

# Banco H2 em arquivo: os dados sobrevivem quando o backend reinicia
spring.datasource.url=jdbc:h2:file:./data/urbanrisk
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Datas em ISO-8601 (UTC) na API
spring.jackson.time-zone=UTC

# Nenhum stack trace vai para o cliente
server.error.include-stacktrace=never
server.error.include-message=never

# Actuator: so o necessario para monitorar disponibilidade
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Simulador de sensores (gera leituras a cada 10s)
app.simulador.enabled=true
app.simulador.intervalo-ms=10000
app.simulador.chance-pico=0.03

# Recalculo periodico da prioridade (recencia decai com o tempo)
app.priorizacao.intervalo-ms=60000

# CORS: origens liberadas (em producao, trocar pelo dominio do app)
app.cors.origens=*

# LGPD: salt do hash de contato (em producao vem de variavel de ambiente)
app.lgpd.salt=${URBANRISK_SALT:troque-este-salt-em-producao}
app.lgpd.dias-retencao-contato=30
