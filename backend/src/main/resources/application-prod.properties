# Perfil de producao (exemplo): PostgreSQL gerenciado e varias instancias atras de um load balancer
# Ativar com: SPRING_PROFILES_ACTIVE=prod
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/urbanrisk}
spring.datasource.username=${DATABASE_USER:urbanrisk}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.hikari.maximum-pool-size=20

spring.h2.console.enabled=false
springdoc.swagger-ui.enabled=false

# Em producao o simulador fica desligado: os dados vem dos sensores reais
app.simulador.enabled=false
app.cors.origens=${CORS_ORIGENS:https://app.urbanrisk.exemplo}
app.lgpd.salt=${URBANRISK_SALT}
